<div class="login-container">
  <div class="login-card">
    <h2>Se connecter</h2>

    <div class="form-group">
      <label>Login</label>
      <input type="text" [(ngModel)]="username" placeholder="Entrez votre login" />
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="password" placeholder="Entrez votre mot de passe" />
    </div>

    <button class="btn-primary" (click)="onLogin()">Se connecter</button>

    <p class="link">Pas de compte ? <a routerLink="/register">S'inscrire</a></p>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
  </div>
</div>
