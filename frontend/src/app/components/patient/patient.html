<div class="container">
  <div class="top-actions">
    <h2>Gestion des Patients</h2>
    <button mat-stroked-button color="primary" routerLink="/dashboard">Retour à l'accueil</button>
  </div>
  <app-clinique-info></app-clinique-info>

  <div class="form-section">
    <mat-form-field appearance="outline">
      <mat-label>Nom</mat-label>
      <input matInput [(ngModel)]="newPatient.nom" placeholder="Ex: Ben Salah" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Prenom</mat-label>
      <input matInput [(ngModel)]="newPatient.prenom" placeholder="Ex: Amira" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="newPatient.email" placeholder="Ex: amira@email.com" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Telephone</mat-label>
      <input matInput [(ngModel)]="newPatient.telephone" placeholder="Ex: 22123456" />
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="save()" [disabled]="isSaving || !selectedClinique">
      <mat-icon>{{ editMode ? 'save' : 'add' }}</mat-icon>
      {{ editMode ? 'Modifier' : 'Ajouter' }}
    </button>

    <button mat-button *ngIf="editMode" (click)="reset()" [disabled]="isSaving">
      <mat-icon>cancel</mat-icon>
      Annuler
    </button>
  </div>

  <p class="hint-message" *ngIf="!selectedClinique">
    Choisir d'abord l'adresse de la clinique.
  </p>

  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

  <table mat-table [dataSource]="patients" class="mat-elevation-z8">
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let p; let i = index">{{ i + 1 }}</td>
    </ng-container>

    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let p">{{ p.nom }}</td>
    </ng-container>

    <ng-container matColumnDef="prenom">
      <th mat-header-cell *matHeaderCellDef>Prenom</th>
      <td mat-cell *matCellDef="let p">{{ p.prenom }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let p">{{ p.email }}</td>
    </ng-container>

    <ng-container matColumnDef="telephone">
      <th mat-header-cell *matHeaderCellDef>Telephone</th>
      <td mat-cell *matCellDef="let p">{{ p.telephone }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let p">
        <button mat-icon-button color="primary" (click)="edit(p)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(p.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
