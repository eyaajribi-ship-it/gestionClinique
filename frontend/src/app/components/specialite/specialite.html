<div class="container">
  <div class="top-actions">
    <h2>Gestion des Specialites</h2>
    <button mat-stroked-button color="primary" routerLink="/dashboard">Retour à l'accueil</button>
  </div>
  <app-clinique-info></app-clinique-info>

  <div class="form-section">
    <mat-form-field appearance="outline">
      <mat-label>Nom de la specialite</mat-label>
      <input matInput [(ngModel)]="newSpecialite.nom" placeholder="Ex: Cardiologie" />
    </mat-form-field>

    <button mat-raised-button color="primary" (click)="save()" [disabled]="isSaving">
      <mat-icon>{{ editMode ? 'save' : 'add' }}</mat-icon>
      {{ editMode ? 'Modifier' : 'Ajouter' }}
    </button>

    <button mat-button *ngIf="editMode" (click)="reset()" [disabled]="isSaving">
      <mat-icon>cancel</mat-icon>
      Annuler
    </button>
  </div>

  <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

  <table mat-table [dataSource]="specialites" class="mat-elevation-z8">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let s">{{ s.id }}</td>
    </ng-container>

    <ng-container matColumnDef="nom">
      <th mat-header-cell *matHeaderCellDef>Nom</th>
      <td mat-cell *matCellDef="let s">{{ s.nom }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let s">
        <button mat-icon-button color="primary" (click)="edit(s)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(s.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
